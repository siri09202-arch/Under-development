<script>
/* ---- DisasterWatch Live : standalone single-file build --------------------
   The original app proxied several public data sources through a server to
   work around CORS.  All of those sources now send `Access-Control-Allow-Origin: *`,
   so this build talks to them directly by rewriting the old /api/* paths.
   WebSockets (p2pquake / wolfx EEW) connect directly and need no rewrite.   */
(function () {
  var P2P    = 'https://api.p2pquake.net/v2/history';
  var USGS   = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary';
  var GH     = 'https://raw.githubusercontent.com';
  var JMA    = 'https://www.jma.go.jp/bosai';
  var GEOSH  = 'https://geoshape.ex.nii.ac.jp/jma/vector/tile';
  var KYOSH  = 'https://weather-kyoshin.west.edge.storage-yahoo.jp';
  var RULES = [
    [/^\/api\/proxy\/p2pquake/, function (u) { return P2P + (u.indexOf('?') >= 0 ? u.slice(u.indexOf('?')) : ''); }],
    [/^\/api\/proxy\/usgs/, function (u) {
      var cm = u.match(/[?&]catalog=([^&]+)/);
      if (cm) {
        return 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&eventtype=earthquake&minmagnitude=2.5&orderby=time&limit=20000';
      }
      var m = u.match(/[?&]feed=([^&]+)/);
      var feed = m ? decodeURIComponent(m[1]) : '4.5_week';
      return USGS + '/' + feed + '.geojson';
    }],
    [/^\/api\/proxy\/jma-stations/, function () { return GH + '/iku55/jma_int_stations/main/stations.json'; }],
    [/^\/api\/proxy\/tsunami-geojson/, function () { return GH + '/dataofjapan/land/master/japan.geojson'; }],
    [/^\/api\/proxy\/tectonic-plates/, function () { return GH + '/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json'; }],
    [/^\/api\/proxy\/jma-targettimes/, function () { return JMA + '/jmatile/data/rasrf/targetTimes.json'; }],
    [/^\/api\/proxy\/jma-nowc-times/, function () { return JMA + '/jmatile/data/nowc/targetTimes_N1.json'; }],
    [/^\/api\/proxy\/jma-thunder-times/, function () { return JMA + '/jmatile/data/nowc/targetTimes_N3.json'; }],
    [/^\/api\/proxy\/jma-typhoon-list/, function () { return JMA + '/typhoon/data/targetTc.json'; }],
    [/^\/api\/proxy\/jma-typhoon-spec\/(TC\d{4})/, function (u, m) { return JMA + '/typhoon/data/' + m[1] + '/specifications.json'; }],
    [/^\/api\/proxy\/jma-typhoon\/(TC\d{4})/, function (u, m) { return JMA + '/typhoon/data/' + m[1] + '/forecast.json'; }],
    [/^\/api\/proxy\/amedas-latest-time/, function () { return JMA + '/amedas/data/latest_time.txt'; }],
    [/^\/api\/proxy\/amedas-map\/(\d{14})/, function (u, m) { return JMA + '/amedas/data/map/' + m[1] + '.json'; }],
    [/^\/api\/proxy\/amedas-table/, function () { return JMA + '/amedas/const/amedastable.json'; }],
    [/^\/api\/proxy\/pbf\/([^/]+)\/(\d+)\/(\d+)\/(\d+)/, function (u, m) { return GEOSH + '/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + m[4] + '.pbf'; }],
    [/^\/api\/kyoshin\/sitelist/, function () { return KYOSH + '/SiteList/sitelist.json'; }],
    [/^\/api\/kyoshin\/realtime\/(\d{8})\/(\d{14})/, function (u, m) { return KYOSH + '/RealTimeData/' + m[1] + '/' + m[2] + '.json'; }]
  ];

  function toAbsoluteUrl(value) {
    if (typeof value !== 'string') return '';
    var v = value.trim();
    if (!v) return '';
    if (/^(https?:|data:|blob:|about:|javascript:)/i.test(v)) return v;
    try {
      return new URL(v, window.location.href).href;
    } catch (e) {
      return v;
    }
  }

  function normalizeUrlForRewrite(value) {
    var url = toAbsoluteUrl(value);
    if (!url) return url;
    try {
      var parsed = new URL(url);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        return parsed.href;
      }
    } catch (e) {}
    return url;
  }

  function rewrite(url) {
    if (typeof url !== 'string') return url;
    var value = normalizeUrlForRewrite(url);
    var q = value.indexOf('?');
    var path = q >= 0 ? value.slice(0, q) : value;
    for (var i = 0; i < RULES.length; i++) {
      var m = path.match(RULES[i][0]);
      if (m) return RULES[i][1](value, m);
    }
    return value;
  }

  function getRequestUrl(input) {
    if (typeof input === 'string') return input;
    if (input instanceof URL) return input.href;
    if (input && typeof input === 'object') {
      if (typeof input.url === 'string') return input.url;
      if (typeof input.href === 'string') return input.href;
      if (typeof input.toString === 'function') {
        var value = input.toString();
        if (typeof value === 'string' && value.indexOf('http') === 0) return value;
      }
    }
    return '';
  }

  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  if (nativeFetch) {
    window.fetch = function (input, init) {
      var rawInput = input;
      var finalUrl = getRequestUrl(input);
      var rewrittenInput = input;
      try {
        if (finalUrl) {
          var rewritten = rewrite(finalUrl);
          if (rewritten !== finalUrl) {
            finalUrl = rewritten;
            if (typeof rawInput === 'string') {
              rewrittenInput = finalUrl;
            } else if (rawInput instanceof Request) {
              rewrittenInput = new Request(finalUrl, rawInput);
            } else if (rawInput && typeof rawInput === 'object') {
              rewrittenInput = new Request(finalUrl, rawInput);
            } else {
              rewrittenInput = finalUrl;
            }
          }
        }
      } catch (e) { /* fall through to native fetch on rewrite failure */ }

      var p = nativeFetch(rewrittenInput, init);
      if (/geoshape\.ex\.nii\.ac\.jp\/.+\.pbf(\?|$)/.test(finalUrl || '')) {
        return p.catch(function () { return new Response(new ArrayBuffer(0), { status: 404, statusText: 'Not Found' }); });
      }
      return p;
    };
  }

  if (window.XMLHttpRequest) {
    var originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url, async, user, password) {
      try {
        var rawUrl = getRequestUrl(url);
        if (rawUrl) {
          var rewritten = rewrite(rawUrl);
          if (rewritten !== rawUrl) {
            url = rewritten;
          }
        }
      } catch (e) { /* ignore rewrite failure */ }
      return originalOpen.call(this, method, url, async, user, password);
    };
  }

  window.DW_REWRITE = rewrite;
})();
</script>
